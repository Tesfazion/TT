<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="Product Strategy Fundamentals certificate">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a" />
      <stop offset="1" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24" />
      <stop offset="1" stop-color="#10b981" />
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22" />
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)" />
  <circle cx="280" cy="210" r="240" fill="url(#accent)" opacity="0.16" filter="url(#blur)" />
  <circle cx="980" cy="610" r="300" fill="#22c55e" opacity="0.10" filter="url(#blur)" />

  <rect x="70" y="70" width="1060" height="610" rx="38" fill="#0b0f1a" opacity="0.58" stroke="#ffffff" stroke-opacity="0.10" />
  <rect x="98" y="98" width="1004" height="554" rx="30" fill="none" stroke="url(#accent)" stroke-opacity="0.35" />

  <g transform="translate(118 128)">
    <rect x="0" y="0" width="56" height="56" rx="16" fill="url(#accent)" opacity="0.95" />
    <path d="M18 40V18h20v22" fill="none" stroke="#0b0f1a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M18 26h20" fill="none" stroke="#0b0f1a" stroke-width="6" stroke-linecap="round" />
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial" fill="#ffffff">
    <text x="200" y="168" font-size="18" opacity="0.8" letter-spacing="2">CERTIFICATE</text>
    <text x="200" y="230" font-size="54" font-weight="800">Product Strategy Fundamentals</text>
    <text x="200" y="278" font-size="22" opacity="0.85">Workshops + reading • Discovery • Roadmaps • Alignment</text>

    <text x="200" y="338" font-size="16" opacity="0.75">Presented to</text>
    <text x="200" y="388" font-size="44" font-weight="800">Tesfatseyon Merkineh</text>
    <text x="200" y="440" font-size="16" opacity="0.7">In recognition of continuous learning in discovery, prioritization, and stakeholder alignment.</text>

    <text x="200" y="520" font-size="16" opacity="0.75">Issued</text>
    <text x="200" y="548" font-size="28" font-weight="700">2025</text>

    <text x="865" y="520" font-size="16" opacity="0.75">Focus</text>
    <text x="865" y="548" font-size="22" font-weight="700">Outcomes</text>
  </g>

  <rect x="200" y="608" width="320" height="12" rx="6" fill="url(#accent)" opacity="0.9" />
</svg>
